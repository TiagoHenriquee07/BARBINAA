<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbina CMS | Painel Administrativo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="admin-style-v2.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- SIDEBAR FIXA -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <span class="logo-icon">✦</span>
                <span class="logo-text">Barbina</span>
                <span class="logo-badge">CMS</span>
            </div>
            
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-module="overview">
                    <i class="fas fa-chart-line"></i>
                    <span>Visão Geral</span>
                </a>
                <a href="#" class="nav-item" data-module="reservations">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Reservas</span>
                </a>
                <a href="#" class="nav-item" data-module="menu">
                    <i class="fas fa-utensils"></i>
                    <span>Cardápio</span>
                </a>
                <a href="#" class="nav-item" data-module="environments">
                    <i class="fas fa-images"></i>
                    <span>Ambientes & Carrossel</span>
                </a>
            </nav>
            
            <!-- Card de Perfil do Administrador -->
            <div class="sidebar-profile">
                <div class="profile-avatar">
                    <img src="https://ui-avatars.com/api/?background=9A8456&color=fff&bold=true&size=48&name=Admin+Barbina" alt="Admin">
                </div>
                <div class="profile-info">
                    <h4>Marcelo 244</h4>
                    <p>Gerente Geral</p>
                </div>
                <button class="profile-logout" id="logoutBtn" title="Sair">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </aside>
        
        <!-- MAIN CONTENT -->
        <main class="main-content">
            <header class="main-header">
                <h1 id="pageTitle">Visão Geral</h1>
                <div class="header-actions">
                    <div class="date-time" id="currentDateTime"></div>
                    <button class="btn-refresh" id="refreshBtn">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </header>
            
            <div class="content-area" id="contentArea">
                <!-- Conteúdo dinâmico renderizado via JS -->
            </div>
        </main>
    </div>
    
    <!-- MODAL GLOBAL -->
    <div class="modal" id="globalModal">
        <div class="modal-content">
            <button class="modal-close" id="modalCloseBtn">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>
    
    <script src="admin-main-v2.js"></script>
</body>
</html>
